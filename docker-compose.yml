name: lms-platform

services:
  # PHP-FPM application container — runs the Laravel 13 codebase
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    environment:
      - PHP_IDE_CONFIG=serverName=lms
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - lms_network

  # Nginx — serves the app and proxies PHP requests to the app container
  nginx:
    image: nginx:1.27-alpine
    container_name: lms_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - lms_network

  # PostgreSQL 18 — primary database
  postgres:
    image: postgres:18-alpine
    container_name: lms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-lms}
      POSTGRES_USER: ${DB_USERNAME:-lms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-lms_user} -d ${DB_DATABASE:-lms}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lms_network

  # Redis — cache, sessions, and queue driver
  redis:
    image: redis:7-alpine
    container_name: lms_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - lms_network

  # Queue worker — processes background jobs (video processing callbacks, emails, notifications)
  # Uses the same image as `app`; only the running command differs.
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan.php queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./src:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - lms_network

  # Scheduler — runs Laravel's scheduled tasks (e.g., subscription expiry checks) every minute
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    entrypoint: ["sh", "-c", "while true; do php artisan.php schedule:run --verbose --no-interaction; sleep 60; done"]
    volumes:
      - ./src:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - lms_network

  # Mailpit — catches all outgoing emails locally for testing (purchase confirmations, grading notices)
  # Web UI available at http://localhost:8025 — remove this service in production, use SES/Resend instead.
  mailpit:
    image: axllent/mailpit:latest
    container_name: lms_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP
    networks:
      - lms_network

  # MinIO — S3 compatible object storage for local testing
  minio:
    image: minio/minio:latest
    container_name: lms_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lms_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lms_minio_secret}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - lms_network

  minio-setup:
    image: minio/mc:latest
    container_name: lms_minio_setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set lms_minio http://minio:9000 ${MINIO_ROOT_USER:-lms_minio_admin} ${MINIO_ROOT_PASSWORD:-lms_minio_secret};
      /usr/bin/mc mb lms_minio/${MINIO_BUCKET:-lms-videos} --ignore-existing;
      /usr/bin/mc anonymous set public lms_minio/${MINIO_BUCKET:-lms-videos};
      exit 0;
      "
    networks:
      - lms_network

networks:
  lms_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data: